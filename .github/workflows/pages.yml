# The browser version as a static site on GitHub Pages: everything runs on the visitor's computer.
# Only main is published: changes are tested on beta (the lab test machine), then merged into main.
# Pages limits a site to about 1 GB and 100 GB of traffic a month, so the 0.85 GB of models are not
# part of the site; the page downloads them from RETIVASC_MODELS_URL (a repository variable, e.g. a
# Hugging Face model repository at a version tag, https://huggingface.co/<owner>/<repo>/resolve/<tag>/), which must
# allow cross-origin requests. Without that variable the job is skipped.
# VascX loads from its authors' repository on Hugging Face at a fixed revision (RETIVASC_VASCX_URL
# overrides it). TPOT, the lab's enhancement, loads from RETIVASC_TPOT_URL; without it the site
# says the enhancement is not installed, and the other pipelines work.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.RETIVASC_MODELS_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build
        working-directory: webui
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_MODELS_URL: ${{ vars.RETIVASC_MODELS_URL }}
          VITE_VASCX_URL: ${{ vars.RETIVASC_VASCX_URL || 'https://huggingface.co/Eyened/vascx/resolve/383bcf530510a7c8d7ad7bc34ec23f48c87ce29d/' }}
          VITE_TPOT_URL: ${{ vars.RETIVASC_TPOT_URL }}
        run: |
          npm ci
          npm run check
          npx vite build
          find dist/models -name '*.onnx' -delete   # never part of the site, even if present
          # without a host for TPOT the site must not claim to have it
          if [ -z "$VITE_TPOT_URL" ]; then rm -f dist/models/tpot/manifest.json; fi
      - name: Check that the models are reachable from a browser
        run: |
          check() { curl -sfIL -H 'Origin: https://example.github.io' "$1" | grep -qi '^access-control-allow-origin' \
            || { echo "::error::$1 is missing or does not allow cross-origin requests"; exit 1; }; }
          url="${{ vars.RETIVASC_MODELS_URL }}"; check "${url%/}/disc_cup/disc_cup.onnx"
          url="${{ vars.RETIVASC_VASCX_URL || 'https://huggingface.co/Eyened/vascx/resolve/383bcf530510a7c8d7ad7bc34ec23f48c87ce29d/' }}"; check "${url%/}/disc/disc_may26.onnx"
          url="${{ vars.RETIVASC_TPOT_URL }}"; if [ -n "$url" ]; then check "${url%/}/tpot.onnx"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
