name: portable-unit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python 3.10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            torch_profile: torch-cpu.txt
          - os: ubuntu-latest
            torch_profile: torch-cpu.txt
          - os: macos-14
            torch_profile: torch-macos.txt
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU-portable test environment
        run: |
          python -m pip install --upgrade pip==24.2 setuptools==80.9.0 wheel==0.44.0
          python -m pip install -r requirements/${{ matrix.torch_profile }}
          python -m pip install -r requirements/test.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check dependencies and public CLI
        run: |
          python -m pip check
          python -m automorph_v2 --help
      - name: Run portable release tests
        run: python -m pytest tests -q -p no:cacheprovider
